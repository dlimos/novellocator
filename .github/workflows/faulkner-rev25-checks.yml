name: Faulkner REV25 checks

on:
  push:
    branches:
      - fix/faulkner-rev25-unlocated-quotes
  pull_request:
    branches:
      - docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
