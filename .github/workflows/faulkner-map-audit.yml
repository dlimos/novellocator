name: Faulkner geographic map final audit
on:
  push:
    branches: [fix/faulkner-final-audit-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Inspect actual online map canvas and layer graphics
        run: node tests/check-faulkner-map.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faulkner-map-diagnostic
          path: faulkner-map-diagnostic/
          if-no-files-found: warn

  multilingual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm TypeScript types
        run: npm run typecheck
      - name: Confirm generated browser adapter is valid
        run: |
          npm run build:browser
          node tests/check-faulkner-quotations.cjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Verify English Italian Spanish microlocation titles, descriptions and passages
        run: node tests/check-faulkner-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faulkner-localized-visual
          path: faulkner-browser-audit/
          if-no-files-found: warn
